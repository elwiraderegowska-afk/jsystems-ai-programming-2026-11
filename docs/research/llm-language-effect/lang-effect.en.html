<!doctype html>
<html lang="en">

<style>
/* Layout: single reading column (max 980px) of evidence "chapters"; each chapter = claim, chart, verdict chip, source line. */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --ink: #14161a;
  --ink-2: #4a4f59;
  --ink-3: #737a86;
  --rule: #dfe2e8;
  --grid: #eceef2;
  --accent: #1f4fa3;
  --en: #2a78d6;
  --pl: #eb6834;
  --sl: #1baf7a;
  --neutral: #a3a9b4;
  --good-bg: #e4f3ea; --good-fg: #1d6b3f;
  --warn-bg: #fbf0d9; --warn-fg: #8a5a00;
  --bad-bg: #fbe5e3;  --bad-fg: #9c2b23;
  --info-bg: #e7eefb; --info-fg: #1f4fa3;
  --f-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --surface: #191c21; --ink: #f1f2f4; --ink-2: #c0c5ce; --ink-3: #8f96a2;
    --rule: #2c3038; --grid: #23272e; --accent: #8fb3f0;
    --en: #3987e5; --pl: #d95926; --sl: #199e70; --neutral: #69707c;
    --good-bg: #16301f; --good-fg: #8fd9ab; --warn-bg: #33270d; --warn-fg: #f0c56b;
    --bad-bg: #3a1a17; --bad-fg: #f2a097; --info-bg: #182640; --info-fg: #a9c4f5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #191c21; --ink: #f1f2f4; --ink-2: #c0c5ce; --ink-3: #8f96a2;
  --rule: #2c3038; --grid: #23272e; --accent: #8fb3f0;
  --en: #3987e5; --pl: #d95926; --sl: #199e70; --neutral: #69707c;
  --good-bg: #16301f; --good-fg: #8fd9ab; --warn-bg: #33270d; --warn-fg: #f0c56b;
  --bad-bg: #3a1a17; --bad-fg: #f2a097; --info-bg: #182640; --info-fg: #a9c4f5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--f-body); }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 20px; padding-block: 40px 80px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 650; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(30px, 5vw, 46px); line-height: 1.08; }
h2 { font-size: clamp(22px, 3.2vw, 28px); line-height: 1.2; }
h3 { font-size: 18px; }
p { margin: 0; max-width: 68ch; }
a { color: var(--accent); }
.eyebrow { font: 500 12px/1.4 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }

header.hero { display: grid; gap: 18px; padding-block: 8px 28px; border-bottom: 1px solid var(--rule); }
.hero .lede { font-size: 17px; color: var(--ink-2); }
.claim { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; margin-top: 6px; }
.claim > div { background: var(--surface); padding: 16px 18px; display: grid; gap: 6px; align-content: start; }
.claim .tag { font: 500 11px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; }
.claim .said .tag { color: var(--bad-fg); }
.claim .shows .tag { color: var(--good-fg); }
.claim q { font-family: var(--f-display); font-size: 20px; line-height: 1.3; quotes: "„" "”"; }
@media (max-width: 640px) { .claim { grid-template-columns: 1fr; } }

nav.toc { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 18px; }
nav.toc a { font: 500 13px/1 var(--f-body); text-decoration: none; color: var(--ink-2); padding: 8px 12px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); }
nav.toc a:hover, nav.toc a:focus-visible { color: var(--ink); border-color: var(--ink-3); }

section.ch { display: grid; gap: 16px; padding-block: 36px; border-bottom: 1px solid var(--rule); }
section.ch > p { color: var(--ink-2); }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { font: 500 13px/1 var(--f-body); color: var(--ink-2); background: transparent; border: 0; padding: 9px 12px; cursor: pointer; border-right: 1px solid var(--rule); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; width: 100%; height: auto; min-width: 520px; }
.chart svg text { fill: var(--ink-2); font: 12px var(--f-body); }
.chart svg .lbl-strong { fill: var(--ink); font-weight: 600; }
.chart svg .axis { stroke: var(--rule); }
.chart svg .gridl { stroke: var(--grid); }
.hit { fill: transparent; cursor: default; }
.verdict { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; }
.chip { font: 600 12px/1 var(--f-body); padding: 6px 9px; border-radius: 6px; white-space: nowrap; }
.chip.good { background: var(--good-bg); color: var(--good-fg); }
.chip.warn { background: var(--warn-bg); color: var(--warn-fg); }
.chip.bad { background: var(--bad-bg); color: var(--bad-fg); }
.chip.info { background: var(--info-bg); color: var(--info-fg); }
.verdict p { color: var(--ink); flex: 1 1 320px; }
.src { font-size: 12.5px; color: var(--ink-3); }
.src a { color: var(--ink-2); }
details { font-size: 13px; }
details summary { cursor: pointer; color: var(--ink-2); }
.tbl { overflow-x: auto; margin-top: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th { font-weight: 600; color: var(--ink-2); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }

.matrix { display: grid; gap: 0; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--surface); }
.mrow { display: grid; grid-template-columns: minmax(0, 1.2fr) 130px minmax(0, 1.6fr) 110px; gap: 14px; padding: 13px 16px; border-bottom: 1px solid var(--rule); align-items: center; }
.mrow:last-child { border-bottom: 0; }
.mrow.head { font: 500 11px/1.3 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); background: transparent; }
.mrow .area { font-weight: 600; }
.mrow .note { color: var(--ink-2); font-size: 13.5px; }
.bars5 { display: inline-flex; gap: 3px; }
.bars5 i { width: 14px; height: 8px; border-radius: 2px; background: var(--grid); display: block; }
.bars5 i.on { background: var(--ink-2); }
@media (max-width: 720px) {
  .mrow { grid-template-columns: 1fr auto; }
  .mrow .note { grid-column: 1 / -1; }
  .mrow.head { display: none; }
}

.calc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 720px) { .calc { grid-template-columns: 1fr; } }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; color: var(--ink-2); }
input[type=range] { width: 100%; accent-color: var(--pl); }
select { font: 14px var(--f-body); padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); }
.big { font: 600 34px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; }

.status-filter { display: flex; flex-wrap: wrap; gap: 8px; }
.status-filter button { font: 500 12.5px/1 var(--f-body); border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 7px 11px; cursor: pointer; }
.status-filter button[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--ink); color: var(--bg); font: 12.5px/1.45 var(--f-body); padding: 8px 10px; border-radius: 6px; max-width: 260px; box-shadow: 0 4px 14px rgb(0 0 0 / 0.18); }
.tip b { font-weight: 600; }
footer { padding-block: 30px 0; color: var(--ink-3); font-size: 13px; display: grid; gap: 8px; }
@media (prefers-reduced-motion: no-preference) {
  .anim { transition: cx 450ms ease, x 450ms ease, x1 450ms ease, x2 450ms ease, width 450ms ease; }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <div class="eyebrow" id="t-eyebrow"></div>
    <h1 id="t-h1"></h1>
    <p class="lede" id="t-lede"></p>
    <div class="claim">
      <div class="said"><span class="tag" id="t-said-tag"></span><q id="t-said"></q><span class="src" id="t-said-src"></span></div>
      <div class="shows"><span class="tag" id="t-shows-tag"></span><q id="t-shows"></q><span class="src" id="t-shows-src"></span></div>
    </div>
  </header>

  <nav class="toc" id="toc" aria-label="Sections"></nav>

  <section class="ch" id="verdict">
    <div class="eyebrow" id="t-m-eyebrow"></div>
    <h2 id="t-m-h"></h2>
    <p id="t-m-p"></p>
    <div class="matrix" id="matrix"></div>
  </section>

  <section class="ch" id="oneruler">
    <div class="eyebrow" id="t-or-eyebrow"></div>
    <h2 id="t-or-h"></h2>
    <p id="t-or-p"></p>
    <div class="panel">
      <div class="row">
        <div class="seg" role="group" id="or-seg"></div>
        <div class="legend" id="or-legend"></div>
      </div>
      <div class="chart" id="or-chart"></div>
      <ul id="or-caveats" style="margin:0;padding-left:18px;display:grid;gap:4px;color:var(--ink-2);font-size:14px"></ul>
      <div class="verdict"><span class="chip warn" id="t-or-chip"></span><p id="t-or-v"></p></div>
      <div class="src" id="t-or-src"></div>
    </div>
  </section>

  <section class="ch" id="reasoning">
    <div class="eyebrow" id="t-pisa-eyebrow"></div>
    <h2 id="t-pisa-h"></h2>
    <p id="t-pisa-p"></p>
    <div class="panel">
      <div class="row">
        <div class="seg" role="group" id="pisa-seg"></div>
        <div class="legend" id="pisa-legend"></div>
      </div>
      <div class="chart" id="pisa-chart"></div>
      <details><summary id="t-table1"></summary><div class="tbl" id="pisa-table"></div></details>
      <div class="verdict"><span class="chip good" id="t-pisa-chip"></span><p id="t-pisa-v"></p></div>
      <div class="src" id="t-pisa-src"></div>
    </div>

    <h3 id="t-mgsm-h" style="margin-top:14px"></h3>
    <p id="t-mgsm-p" style="color:var(--ink-2)"></p>
    <div class="panel">
      <div class="row">
        <div class="seg" role="group" id="mgsm-seg"></div>
        <div class="legend" id="mgsm-legend"></div>
      </div>
      <div class="chart" id="mgsm-chart"></div>
      <details><summary id="t-table2"></summary><div class="tbl" id="mgsm-table"></div></details>
      <div class="verdict"><span class="chip good" id="t-mgsm-chip"></span><p id="t-mgsm-v"></p></div>
      <div class="src" id="t-mgsm-src"></div>
    </div>

    <h3 id="t-med-h" style="margin-top:14px"></h3>
    <p id="t-med-p" style="color:var(--ink-2)"></p>
    <div class="panel">
      <div class="row">
        <div class="seg" role="group" id="med-seg"></div>
        <div class="legend" id="med-legend"></div>
      </div>
      <div class="chart" id="med-chart"></div>
      <details><summary id="t-table3"></summary><div class="tbl" id="med-table"></div></details>
      <div class="verdict"><span class="chip bad" id="t-med-chip"></span><p id="t-med-v"></p></div>
      <div class="src" id="t-med-src"></div>
    </div>
  </section>

  <section class="ch" id="agents">
    <div class="eyebrow" id="t-ag-eyebrow"></div>
    <h2 id="t-ag-h"></h2>
    <p id="t-ag-p"></p>
    <div class="panel">
      <h3 id="t-clem-h"></h3>
      <div class="legend" id="clem-legend"></div>
      <div class="chart" id="clem-chart"></div>
      <details><summary id="t-table4"></summary><div class="tbl" id="clem-table"></div></details>
      <div class="verdict"><span class="chip bad" id="t-clem-chip"></span><p id="t-clem-v"></p></div>
      <div class="src" id="t-clem-src"></div>
    </div>
    <div class="panel">
      <div class="row">
        <h3 id="t-mif-h"></h3>
        <div class="seg" role="group" id="mif-seg"></div>
      </div>
      <div class="chart" id="mif-chart"></div>
      <div class="verdict"><span class="chip bad" id="t-mif-chip"></span><p id="t-mif-v"></p></div>
      <div class="src" id="t-mif-src"></div>
    </div>
    <div class="panel">
      <h3 id="t-gaia-h"></h3>
      <div class="chart" id="gaia-chart"></div>
      <div class="verdict"><span class="chip bad" id="t-gaia-chip"></span><p id="t-gaia-v"></p></div>
      <div class="src" id="t-gaia-src"></div>
    </div>
  </section>

  <section class="ch" id="tokens">
    <div class="eyebrow" id="t-tok-eyebrow"></div>
    <h2 id="t-tok-h"></h2>
    <p id="t-tok-p"></p>
    <div class="panel">
      <div class="calc">
        <div style="display:grid;gap:14px;align-content:start">
          <div class="field">
            <label for="tok-size" id="t-tok-size"></label>
            <input id="tok-size" type="range" min="500" max="20000" step="500" value="4000">
            <div class="mono num" id="tok-size-out"></div>
          </div>
          <div class="field">
            <label for="tok-lang" id="t-tok-lang"></label>
            <select id="tok-lang"></select>
          </div>
          <div class="field">
            <label for="tok-calls" id="t-tok-calls"></label>
            <input id="tok-calls" type="range" min="10" max="2000" step="10" value="200">
            <div class="mono num" id="tok-calls-out"></div>
          </div>
        </div>
        <div style="display:grid;gap:10px;align-content:start">
          <div class="eyebrow" id="t-tok-res"></div>
          <div class="big" id="tok-big"></div>
          <dl class="kv" id="tok-kv"></dl>
          <p class="src" id="t-tok-note"></p>
        </div>
      </div>
      <div class="chart" id="tok-chart"></div>
      <div class="verdict"><span class="chip info" id="t-tok-chip"></span><p id="t-tok-v"></p></div>
      <div class="src" id="t-tok-src"></div>
    </div>
  </section>

  <section class="ch" id="advice">
    <div class="eyebrow" id="t-adv-eyebrow"></div>
    <h2 id="t-adv-h"></h2>
    <ol id="adv-list" style="margin:0;padding-left:20px;display:grid;gap:10px;max-width:72ch"></ol>
  </section>

  <section class="ch" id="sources">
    <div class="eyebrow" id="t-src-eyebrow"></div>
    <h2 id="t-src-h"></h2>
    <p id="t-src-p"></p>
    <div class="status-filter" id="src-filter"></div>
    <div class="tbl"><table id="src-table"></table></div>
  </section>

  <footer>
    <p id="t-foot1"></p>
    <p id="t-foot2"></p>
  </footer>
</div>
<div class="tip" id="tip" hidden></div>

<script>
const LANG = "en";

/* ---------- Data (from verified primary sources; see report.*.md) ---------- */
const D = {

  ["Nauka w Polsce / PAP — wywiad z M. Karpińską", "https://naukawpolsce.pl/", { pl: "prasa (ślad)", en: "press (lead)" }, 2025, "un"]
];

/* ---------- Helpers ---------- */
const t = T[LANG];
const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt = (n, d = 1) => n.toLocaleString(LANG === "pl" ? "pl-PL" : "en-GB", { minimumFractionDigits: d, maximumFractionDigits: d });
const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const tip = $("tip");
function showTip(evt, html) {
  tip.innerHTML = html; tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let x = evt.clientX + 14, y = evt.clientY + 14;
  if (x + r.width > innerWidth - 8) x = evt.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = evt.clientY - r.height - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.hidden = true; }
function bindTip(node, html) {
  node.addEventListener("mousemove", (e) => showTip(e, html));
  node.addEventListener("mouseleave", hideTip);
}
function seg(containerId, options, initial, onChange) {
  const box = $(containerId); box.innerHTML = "";
  options.forEach(([key, label]) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.dataset.key = key;
    b.setAttribute("aria-pressed", key === initial ? "true" : "false");
    b.addEventListener("click", () => {
      box.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
      onChange(key);
    });
    box.appendChild(b);
  });
}
function legend(id, items) {
  $(id).innerHTML = items.map(([c, l]) => `<span><i class="sw" style="background:var(--${c})"></i>${l}</span>`).join("");
}
function table(id, head, rows) {
  $(id).innerHTML = `<table><thead><tr>${head.map((h, i) => `<th class="${i ? "n" : ""}">${h}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c, i) => `<td class="${i ? "n" : ""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function langColor(k) { return k === "en" ? "en" : k === "pl" ? "pl" : k === "zh" ? "neutral" : "sl"; }

/* Horizontal bar chart: items [{label, v, c, sub?}] */
function hbar(container, items, { max = 100, unit = "%", w = 760, rowH = 34, labelW = 190, decimals = 1, ticks = [0, 25, 50, 75, 100] } = {}) {
  const pad = { t: 8, r: 56, b: 26 };
  const h = pad.t + items.length * rowH + pad.b;
  const svg = el("svg", { viewBox: `0 0 ${w} ${h}`, role: "img" });
  const x = (v) => labelW + (v / max) * (w - labelW - pad.r);
  ticks.forEach((tk) => {
    el("line", { x1: x(tk), x2: x(tk), y1: pad.t, y2: h - pad.b, class: "gridl" }, svg);
    const tx = el("text", { x: x(tk), y: h - 8, "text-anchor": "middle" }, svg); tx.textContent = tk;
  });
  items.forEach((it, i) => {
    const y = pad.t + i * rowH;
    const lb = el("text", { x: labelW - 10, y: y + rowH / 2 + 4, "text-anchor": "end", class: it.strong ? "lbl-strong" : "" }, svg);
    lb.textContent = it.label;
    const bw = Math.max(2, x(it.v) - x(0));
    el("rect", { x: x(0), y: y + 7, width: bw, height: rowH - 14, rx: 4, fill: `var(--${it.c})`, class: "anim" }, svg);
    const vt = el("text", { x: x(0) + bw + 6, y: y + rowH / 2 + 4, class: "lbl-strong" }, svg);
    vt.textContent = fmt(it.v, decimals) + unit;
    const hit = el("rect", { x: 0, y, width: w, height: rowH, class: "hit" }, svg);
    bindTip(hit, `<b>${it.label}</b><br>${fmt(it.v, decimals)}${unit}${it.sub ? "<br>" + it.sub : ""}`);
  });
  container.innerHTML = ""; container.appendChild(svg);
}

/* Dumbbell chart: rows [{label, a, b}] a=EN, b=PL (or other) */
function dumbbell(container, rows, { min = 0, max = 100, w = 760, rowH = 30, labelW = 200, aKey = "en", bKey = "pl", aName, bName, decimals = 1, ticks } = {}) {
  const pad = { t: 8, r: 30, b: 26 };
  const h = pad.t + rows.length * rowH + pad.b;
  const svg = el("svg", { viewBox: `0 0 ${w} ${h}`, role: "img" });
  const x = (v) => labelW + ((v - min) / (max - min)) * (w - labelW - pad.r);
  (ticks || [min, (min + max) / 2, max]).forEach((tk) => {
    el("line", { x1: x(tk), x2: x(tk), y1: pad.t, y2: h - pad.b, class: "gridl" }, svg);
    const tx = el("text", { x: x(tk), y: h - 8, "text-anchor": "middle" }, svg); tx.textContent = tk;
  });
  rows.forEach((r, i) => {
    const cy = pad.t + i * rowH + rowH / 2;
    const lb = el("text", { x: labelW - 10, y: cy + 4, "text-anchor": "end" }, svg); lb.textContent = r.label;
    el("line", { x1: x(Math.min(r.a, r.b)), x2: x(Math.max(r.a, r.b)), y1: cy, y2: cy, stroke: css("--neutral"), "stroke-width": 2, class: "anim" }, svg);
    el("circle", { cx: x(r.a), cy, r: 6, fill: `var(--${aKey})`, stroke: css("--surface"), "stroke-width": 2, class: "anim" }, svg);
    el("circle", { cx: x(r.b), cy, r: 6, fill: `var(--${bKey})`, stroke: css("--surface"), "stroke-width": 2, class: "anim" }, svg);
    const d = r.b - r.a;
    const dt = el("text", { x: w - 4, y: cy + 4, "text-anchor": "end", class: "lbl-strong" }, svg);
    dt.textContent = (d > 0 ? "+" : "") + fmt(d, decimals);
    const hit = el("rect", { x: 0, y: cy - rowH / 2, width: w, height: rowH, class: "hit" }, svg);
    bindTip(hit, `<b>${r.label}</b><br>${aName}: ${fmt(r.a, decimals)}<br>${bName}: ${fmt(r.b, decimals)}<br>Δ ${(d > 0 ? "+" : "") + fmt(d, decimals)} ${t.tipPts}`);
  });
  container.innerHTML = ""; container.appendChild(svg);
}

document.documentElement.lang = LANG;
const textIds = {

  "t-mif-h": "mifH", "t-mif-chip": "mifChip", "t-mif-v": "mifV", "t-mif-src": "mifSrc",

};
for (const id in textIds) $(id).textContent = t[textIds[id]];
$("toc").innerHTML = t.toc.map(([h, l]) => `<a href="#${h}">${l}</a>`).join("");
$("adv-list").innerHTML = t.adv.map((a) => `<li>${a}</li>`).join("");

/* ---------- Matrix ---------- */
const chipClass = { good: "good", warn: "warn", bad: "bad" };
$("matrix").innerHTML =
  `<div class="mrow head">${t.mHead.map((h) => `<div>${h}</div>`).join("")}</div>` +
  t.matrix.map(([area, cls, label, note, s]) =>
    `<div class="mrow"><div class="area">${area}</div><div><span class="chip ${chipClass[cls]}">${label}</span></div><div class="note">${note}</div><div class="bars5" aria-label="${s}/5">${[1,2,3,4,5].map((i) => `<i class="${i <= s ? "on" : ""}"></i>`).join("")}</div></div>`
  ).join("");

/* ---------- OneRuler ---------- */
$("or-caveats").innerHTML = t.orCaveats.map((c) => `<li>${c}</li>`).join("");
function drawOR(mode) {
  const src = mode === "avg" ? D.oneruler : D.oneruler_o3;
  hbar($("or-chart"), src.map((d) => ({ label: t.langName[d.k], v: d.v, c: d.c, strong: d.k === "pl" || d.k === "en" })), { decimals: mode === "avg" ? 1 : 0, rowH: 40, labelW: 150 });
  legend("or-legend", src.map((d) => [d.c, t.langName[d.k]]));
}
seg("or-seg", t.orSeg, "avg", drawOR); drawOR("avg");

/* ---------- mmPISA ---------- */
function drawPISA(col) {
  const ci = D.pisa.cols.indexOf(col) + 1;
  const rows = D.pisa.rows.map((r) => ({ k: r[0], v: r[ci] })).sort((a, b) => b.v - a.v);
  const en = D.pisa.rows[0][ci];
  hbar($("pisa-chart"), rows.map((r) => ({
    label: t.langName[r.k], v: r.v, c: langColor(r.k), strong: r.k === "pl" || r.k === "en",
    sub: r.k === "en" ? "" : `Δ vs ${t.langName.en}: ${(r.v - en > 0 ? "+" : "") + fmt(r.v - en)} ${t.tipPts} (${Math.round((r.v - en) * 1.25)} / 125)`
  })), { max: 100, ticks: [0, 25, 50, 75, 100] });
}
legend("pisa-legend", [["en", t.langName.en], ["pl", t.langName.pl], ["sl", LANG === "pl" ? "inne słowiańskie" : "other Slavic"]]);
seg("pisa-seg", t.pisaSeg, "opus", drawPISA); drawPISA("opus");
table("pisa-table", [t.tblLang, ...t.pisaSeg.map((s) => s[1])], D.pisa.rows.map((r) => [t.langName[r[0]], ...r.slice(1).map((v) => fmt(v))]));

/* ---------- MGSM ---------- */
function drawMGSM(mode) {
  const c = $("mgsm-chart");
  const w = 760, rowH = 30, labelW = 170, pad = { t: 8, r: 40, b: 26 };
  const h = pad.t + D.mgsm.length * rowH + pad.b;
  const min = -1, max = 7;
  const x = (v) => labelW + ((v - min) / (max - min)) * (w - labelW - pad.r);
  const svg = el("svg", { viewBox: `0 0 ${w} ${h}`, role: "img" });
  [-1, 0, 1, 2, 3, 4, 5, 6, 7].forEach((tk) => {
    el("line", { x1: x(tk), x2: x(tk), y1: pad.t, y2: h - pad.b, class: tk === 0 ? "axis" : "gridl", "stroke-width": tk === 0 ? 1.5 : 1 }, svg);
    const tx = el("text", { x: x(tk), y: h - 8, "text-anchor": "middle" }, svg); tx.textContent = tk;
  });
  D.mgsm.forEach(([m, o, f], i) => {
    const cy = pad.t + i * rowH + rowH / 2;
    const lb = el("text", { x: labelW - 10, y: cy + 4, "text-anchor": "end" }, svg); lb.textContent = m;
    if (mode === "both") el("line", { x1: x(f), x2: x(o), y1: cy, y2: cy, stroke: css("--neutral"), "stroke-width": 2 }, svg);
    if (mode !== "fix") el("circle", { cx: x(o), cy, r: 6, fill: "var(--neutral)", stroke: css("--surface"), "stroke-width": 2 }, svg);
    if (mode !== "orig") el("circle", { cx: x(f), cy, r: 6, fill: "var(--sl)", stroke: css("--surface"), "stroke-width": 2 }, svg);
    const hit = el("rect", { x: 0, y: cy - rowH / 2, width: w, height: rowH, class: "hit" }, svg);
    bindTip(hit, `<b>${m}</b><br>${t.mgsmSeg[0][1]}: ${fmt(o)} ${t.tipPts}<br>${t.mgsmSeg[1][1]}: ${fmt(f)} ${t.tipPts}`);
  });
  c.innerHTML = ""; c.appendChild(svg);
}
legend("mgsm-legend", [["neutral", t.mgsmSeg[0][1]], ["sl", t.mgsmSeg[1][1]]]);
seg("mgsm-seg", t.mgsmSeg, "both", drawMGSM); drawMGSM("both");
table("mgsm-table", [t.tblModel, t.tblGapO, t.tblGapF], D.mgsm.map(([m, o, f]) => [m, fmt(o), fmt(f)]));

/* ---------- Medical exams ---------- */
function drawMED(mode) {
  const ia = mode === "lek" ? 2 : 4, ib = mode === "lek" ? 1 : 3;
  const rows = D.med.map((r) => ({ label: r[0], a: r[ia], b: r[ib] })).sort((p, q) => q.a - p.a);
  dumbbell($("med-chart"), rows, { min: 20, max: 100, ticks: [20, 40, 60, 80, 100], aName: t.tblEN, bName: t.tblPL, decimals: 2, labelW: 190 });
}
legend("med-legend", [["en", t.langName.en], ["pl", t.langName.pl]]);
seg("med-seg", t.medSeg, "lek", drawMED); drawMED("lek");
table("med-table", [t.tblModel, "LEK PL", "LEK EN", "LDEK PL", "LDEK EN"], D.med.map((r) => [r[0], ...r.slice(1).map((v) => fmt(v, 2))]));

/* ---------- Clemscore ---------- */
legend("clem-legend", [["en", t.langName.en], ["pl", t.langName.pl]]);
dumbbell($("clem-chart"), D.clem.map(([m, en, pl]) => ({ label: m, a: en, b: pl })), { min: 0, max: 100, ticks: [0, 25, 50, 75, 100], aName: t.tblEN, bName: t.tblPL, labelW: 170 });
table("clem-table", [t.tblModel, t.tblEN, t.tblPL], D.clem.map(([m, en, pl]) => [m, fmt(en), fmt(pl)]));

/* ---------- Instruction following ---------- */
function drawMIF(k) {
  const o = D.mif[k];
  hbar($("mif-chart"), Object.keys(o).sort((a, b) => o[b] - o[a]).map((l) => ({ label: t.langName[l], v: o[l], c: langColor(l), strong: l === "pl" || l === "en" })), { unit: "", rowH: 34, labelW: 150 });
}
seg("mif-seg", t.mifSeg, "avg", drawMIF); drawMIF("avg");

/* ---------- GAIA ---------- */
(function drawGAIA() {
  const c = $("gaia-chart");
  const w = 760, labelW = 200, rowH = 46, pad = { t: 8, r: 60, b: 26 };
  const h = pad.t + D.gaia.length * rowH + pad.b;
  const x = (v) => labelW + (v / 60) * (w - labelW - pad.r);
  const svg = el("svg", { viewBox: `0 0 ${w} ${h}`, role: "img" });
  [0, 20, 40, 60].forEach((tk) => {
    el("line", { x1: x(tk), x2: x(tk), y1: pad.t, y2: h - pad.b, class: "gridl" }, svg);
    const tx = el("text", { x: x(tk), y: h - 8, "text-anchor": "middle" }, svg); tx.textContent = tk + "%";
  });
  D.gaia.forEach(([k, en, other], i) => {
    const y = pad.t + i * rowH;
    const lb = el("text", { x: labelW - 10, y: y + rowH / 2 + 4, "text-anchor": "end" }, svg); lb.textContent = t.gaiaLabels[k];
    [[en, "en", t.langName.en], [other, "sl", t.gaiaOther]].forEach(([v, col, name], j) => {
      const by = y + 6 + j * 17;
      el("rect", { x: x(0), y: by, width: x(v) - x(0), height: 14, rx: 3, fill: `var(--${col})` }, svg);
      const vt = el("text", { x: x(v) + 6, y: by + 11, class: "lbl-strong" }, svg); vt.textContent = fmt(v) + "% · " + name;
    });
    const hit = el("rect", { x: 0, y, width: w, height: rowH, class: "hit" }, svg);
    bindTip(hit, `<b>${t.gaiaLabels[k]}</b><br>${t.langName.en}: ${fmt(en)}%<br>${t.gaiaOther}: ${fmt(other)}%`);
  });
  c.innerHTML = ""; c.appendChild(svg);
})();

/* ---------- Token calculator ---------- */
const tokLang = $("tok-lang");
Object.keys(D.tpw).filter((k) => k !== "en").forEach((k) => {
  const o = document.createElement("option"); o.value = k; o.textContent = t.langName[k]; tokLang.appendChild(o);
});
tokLang.value = "pl";
function calc() {
  const size = +$("tok-size").value, calls = +$("tok-calls").value, k = tokLang.value;
  const mult = D.tpw[k] / D.tpw.en;
  const tokens = Math.round(size * mult);
  $("tok-size-out").textContent = size.toLocaleString(LANG === "pl" ? "pl-PL" : "en-GB");
  $("tok-calls-out").textContent = calls.toLocaleString(LANG === "pl" ? "pl-PL" : "en-GB");
  $("tok-big").textContent = tokens.toLocaleString(LANG === "pl" ? "pl-PL" : "en-GB");
  const kv = t.tokKv;
  $("tok-kv").innerHTML = `<dt>${kv[0]}</dt><dd>${tokens.toLocaleString(LANG === "pl" ? "pl-PL" : "en-GB")}</dd><dt>${kv[1]}</dt><dd>+${(tokens - size).toLocaleString(LANG === "pl" ? "pl-PL" : "en-GB")}</dd><dt>${kv[2]}</dt><dd>+${((tokens - size) * calls).toLocaleString(LANG === "pl" ? "pl-PL" : "en-GB")}</dd><dt>${kv[3]}</dt><dd>×${fmt(mult, 2)}</dd>`;
  hbar($("tok-chart"), Object.keys(D.tpw).sort((a, b) => D.tpw[a] - D.tpw[b]).map((l) => ({ label: t.langName[l], v: D.tpw[l], c: langColor(l), strong: l === k || l === "en" })), { max: 3, unit: "", decimals: 2, ticks: [0, 1, 2, 3], labelW: 150, rowH: 30 });
}
["tok-size", "tok-calls", "tok-lang"].forEach((id) => $(id).addEventListener("input", calc));
calc();

/* ---------- Sources ---------- */
const statusChip = { ok: "good", once: "info", un: "warn" };
function drawSources(filter) {
  const rows = SOURCES.filter((s) => filter === "all" || s[4] === filter);
  $("src-table").innerHTML = `<thead><tr>${t.srcHead.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(([n, u, a, y, s]) => `<tr><td style="white-space:normal"><a href="${u}" target="_blank" rel="noopener">${n}</a></td><td>${a[LANG]}</td><td class="num">${y}</td><td><span class="chip ${statusChip[s]}">${t.statusLbl[s]}</span></td></tr>`).join("") + "</tbody>";
}
(function () {
  const box = $("src-filter");
  ["all", "ok", "once", "un"].forEach((k) => {
    const b = document.createElement("button"); b.type = "button";
    const count = k === "all" ? SOURCES.length : SOURCES.filter((s) => s[4] === k).length;
    b.textContent = `${t.statusLbl[k]} (${count})`; b.setAttribute("aria-pressed", k === "all" ? "true" : "false");
    b.addEventListener("click", () => { box.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false")); drawSources(k); });
    box.appendChild(b);
  });
  drawSources("all");
})();

/* Redraw charts that read computed colors when the theme flips */
const mq = matchMedia("(prefers-color-scheme: dark)");
const redraw = () => {
  const p = (id) => $(id).querySelector('[aria-pressed="true"]')?.dataset.key;
  drawMGSM(p("mgsm-seg") || "both"); drawMED(p("med-seg") || "lek");
  dumbbell($("clem-chart"), D.clem.map(([m, en, pl]) => ({ label: m, a: en, b: pl })), { min: 0, max: 100, ticks: [0, 25, 50, 75, 100], aName: t.tblEN, bName: t.tblPL, labelW: 170 });
};
mq.addEventListener?.("change", redraw);
new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
